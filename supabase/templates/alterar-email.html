<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirme seu novo e-mail</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f7f0;font-family:Arial,Helvetica,sans-serif;color:#16201a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f7f0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border:1px solid #d6dfcc;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background-color:#007f5f;padding:20px 28px;">
                <p style="margin:0;font-size:18px;font-weight:bold;color:#ffffff;">Escalas</p>
                <p style="margin:2px 0 0;font-size:13px;color:#e0f1e4;">Núcleo Coroa Divina</p>
              </td>
            </tr>
            <tr>
              <td style="height:6px;line-height:6px;font-size:0;background:linear-gradient(90deg,#007f5f,#55a630,#aacc00,#dddf00,#ffff3f);background-color:#aacc00;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:32px 28px 8px;">
                <h1 style="margin:0 0 16px;font-size:22px;color:#007f5f;">Confirme seu novo e-mail</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">
                  Foi solicitada a troca do e-mail da sua conta de <strong>{{ .Email }}</strong>
                  para <strong>{{ .NewEmail }}</strong>. Para confirmar, clique abaixo:
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:8px;background-color:#007f5f;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:8px;">
                        Confirmar novo e-mail
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px 28px;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#5a6b5d;border-top:1px solid #d6dfcc;padding-top:16px;">
                  Não pediu essa alteração? Ignore esta mensagem e avise a administração do núcleo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
